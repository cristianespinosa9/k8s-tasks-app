apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: k8s-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "tasks-api"
        vault.hashicorp.com/agent-inject-secret-db.env: "secret/data/tasks-api/db"
        vault.hashicorp.com/agent-inject-template-db.env: |
          {{- with secret "secret/data/tasks-api/db" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}={{ $v }}
          {{- end }}
          {{- end }}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -a
              [ -f /vault/secrets/db.env ] && . /vault/secrets/db.env
              exec docker-entrypoint.sh postgres
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tasksuser", "-d", "tasksdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "tasksuser", "-d", "tasksdb"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
